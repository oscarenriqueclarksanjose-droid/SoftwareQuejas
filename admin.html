<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Laboratorios Clark</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        canvas { background: #fff; padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Laboratorios Clark</h1>
        <div class="charts">
            <div><h3>Promedio por Servicio</h3><canvas id="barChart"></canvas></div>
            <div><h3>Distribución de Estrellas</h3><canvas id="pieChart"></canvas></div>
        </div>
    </div>

    <script>
        async function cargar() {
            const res = await fetch('https://softwarequejas.onrender.com/ver-opiniones');
            const texto = await res.text();
            const filas = texto.trim().split('\n').slice(1);
            
            const datos = filas.map(f => {
                const c = f.split(',');
                return { servicio: c[2], estrellas: parseInt(c[3]) };
            }).filter(d => !isNaN(d.estrellas));

            // Agrupar para Barras
            const resumen = {};
            datos.forEach(d => {
                if(!resumen[d.servicio]) resumen[d.servicio] = { suma: 0, total: 0 };
                resumen[d.servicio].suma += d.estrellas;
                resumen[d.servicio].total += 1;
            });

            new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(resumen),
                    datasets: [{ label: 'Promedio', data: Object.keys(resumen).map(k => resumen[k].suma / resumen[k].total), backgroundColor: '#0056b3' }]
                }
            });

            // Conteo para Pastel
            const estrellas = [1,2,3,4,5].map(n => datos.filter(d => d.estrellas === n).length);
            new Chart(document.getElementById('pieChart'), {
                type: 'pie',
                data: {
                    labels: ['1⭐','2⭐','3⭐','4⭐','5⭐'],
                    datasets: [{ data: estrellas, backgroundColor: ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#27ae60'] }]
                }
            });
        }
        cargar();
    </script>
</body>
</html>
