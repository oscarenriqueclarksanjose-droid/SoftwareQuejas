<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Laboratorios Clark</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f9; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo-admin { max-width: 100px; margin-bottom: 10px; }
        h1 { color: #0056b3; text-align: center; margin-top: 0; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .chart-box { padding: 15px; border: 1px solid #eee; border-radius: 8px; }
        h3 { text-align: center; color: #444; }
        @media (max-width: 600px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <img src="Logo.jfif" alt="Logo" class="logo-admin">
        <h1>Dashboard de Calidad - Laboratorios Clark</h1>
        <div class="charts-grid">
            <div class="chart-box">
                <h3>Satisfacción por Servicio</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Distribución de Calificaciones</h3>
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        async function cargarGraficas() {
            try {
                // CONEXIÓN A RENDER
                const res = await fetch('https://softwarequejas.onrender.com/ver-opiniones');
                const dataRaw = await res.text();
                
                const filas = dataRaw.split('\n').slice(1).filter(f => f.length > 0);
                const datos = filas.map(f => {
                    const c = f.split(',');
                    return { servicio: c[2], calificacion: parseInt(c[3]) };
                });

                if (datos.length === 0) return;

                const servicios = [...new Set(datos.map(d => d.servicio))];
                const promedios = servicios.map(s => {
                    const filtrados = datos.filter(d => d.servicio === s);
                    return filtrados.reduce((a, b) => a + b.calificacion, 0) / filtrados.length;
                });

                new Chart(document.getElementById('barChart'), {
                    type: 'bar',
                    data: {
                        labels: servicios,
                        datasets: [{ label: 'Promedio de Estrellas', data: promedios, backgroundColor: '#0056b3' }]
                    }
                });

                const conteoEstrellas = [1,2,3,4,5].map(e => datos.filter(d => d.calificacion === e).length);
                
                new Chart(document.getElementById('pieChart'), {
                    type: 'pie',
                    data: {
                        labels: ['1⭐', '2⭐', '3⭐', '4⭐', '5⭐'],
                        datasets: [{ data: conteoEstrellas, backgroundColor: ['#ff4d4d', '#ffa64d', '#ffff4d', '#a6ff4d', '#4dff4d'] }]
                    }
                });
            } catch (error) {
                console.error("Error al cargar datos de Render:", error);
            }
        }
        cargarGraficas();
    </script>
</body>
</html>
