<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorios Clark - Buzón</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f7; display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 90%; max-width: 400px; border-top: 6px solid #0056b3; }
        .logo { max-width: 100px; margin-bottom: 15px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; margin-top: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="Logo.jfif" alt="Logo" class="logo">
        <h2 style="margin:0; color:#0056b3;">Laboratorios Clark</h2>
        <p style="color:#666; font-size:0.9em;">Tu opinión nos ayuda a mejorar</p>

        <label>Nombre:</label>
        <input type="text" id="paciente" placeholder="Opcional">

        <label>Servicio:</label>
        <select id="servicio">
            <option>Análisis de Sangre</option>
            <option>Check-up General</option>
            <option>Perfil de Lípidos</option>
            <option>Otro</option>
        </select>

        <label>Calificación:</label>
        <select id="calificacion">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>

        <label>Comentario:</label>
        <textarea id="comentario" rows="3"></textarea>

        <button onclick="enviar()">Enviar Opinión</button>
    </div>

    <script>
        async function enviar() {
    const datos = {
        paciente: document.getElementById('paciente').value || "Anónimo",
        servicio: document.getElementById('servicio').value,
        calificacion: document.getElementById('calificacion').value,
        comentario: document.getElementById('comentario').value
    };

    if(!datos.comentario) return alert("Escribe un comentario");

    try {
        const res = await fetch('https://softwarequejas.onrender.com/enviar-opinion', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(datos)
        });
        const result = await res.json();
        alert(result.mensaje);
        location.reload(); // Recargar para limpiar
    } catch (e) {
        alert("Error al conectar con el laboratorio.");
    }
}
    </script>
</body>
</html>
